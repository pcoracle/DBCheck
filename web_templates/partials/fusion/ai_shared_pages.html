<!-- ══ AI 对话任务回溯 ══ -->
<div class="page" id="page-ai-tasks">
  <div class="ait-layout">
    <aside class="ait-left">
      <div class="ait-left-header">
        <button type="button" class="ait-back-btn" onclick="showPage('ai-assistant')" data-i18n="webui.ait_back">← 返回</button>
        <input type="search" class="ait-search" id="ait-search" data-i18n-placeholder="webui.ait_search_placeholder" placeholder="搜索提问、理解或结论…">
        <button type="button" class="ait-refresh-btn" id="ait-refresh" data-i18n="webui.ait_refresh">刷新</button>
      </div>
      <div class="ait-stats" id="ait-stats"></div>
      <div class="ait-list" id="ait-list"></div>
    </aside>
    <section class="ait-right">
      <div class="ait-empty" id="ait-empty" data-i18n="webui.ait_empty_hint">左侧选择一条任务，查看「理解 → 思考 → 工具调用 → 结论」</div>
      <div class="ait-detail" id="ait-detail" style="display:none;"></div>
    </section>
  </div>
</div>

<!-- ══ AI 工具管理 ══ -->
<div class="page" id="page-tool-mgmt">
  <div class="tool-wrap">
    <div class="tool-head">
      <div class="tool-title" data-i18n="webui.tool_title">🔧 AI 工具管理</div>
      <div class="tool-head-actions">
        <button type="button" class="btn btn-sm" id="tool-reload-btn"><span data-i18n="webui.tool_reload">🔄 刷新</span></button>
        <button type="button" class="btn btn-sm btn-primary" id="tool-create-btn"><span data-i18n="webui.tool_create">＋ 新增工具</span></button>
      </div>
    </div>
    <div class="tool-filter">
      <input type="text" id="tool-search" data-i18n-placeholder="webui.tool_search_placeholder" placeholder="搜索工具名称或描述…">
      <select id="tool-category-filter"></select>
      <span class="tool-count" id="tool-count"></span>
    </div>
    <div class="tool-table-scroll">
      <table class="tool-table">
        <thead><tr>
          <th data-i18n="webui.tool_col_enabled">启用</th><th data-i18n="webui.tool_col_name">工具名</th><th data-i18n="webui.tool_col_desc">说明</th><th data-i18n="webui.tool_col_category">分类</th><th data-i18n="webui.tool_col_params">参数</th><th data-i18n="webui.tool_col_guard">类型 / 边界</th><th data-i18n="webui.tool_col_actions">操作</th>
        </tr></thead>
        <tbody id="tool-table-body"></tbody>
      </table>
    </div>
    <div class="tool-note" data-i18n="webui.tool_note">
      停用中的工具不会出现在模型的可用清单里；内置工具只能停用不能删除。
      自定义工具只有定义、没有后端实现，助手调用时会被只读边界拒绝。
    </div>
  </div>

  <div class="aias-modal" id="tool-edit-modal" style="display:none;">
    <div class="aias-modal-box">
      <div class="aias-modal-head">
        <span data-editor-title data-i18n="webui.tool_editor_title">工具定义</span>
        <button type="button" class="aias-modal-close" data-close-editor>✕</button>
      </div>
      <div class="tool-form">
        <label><span data-i18n="webui.tool_field_name">工具名（小写字母/数字/下划线）</span><input data-field="name" type="text" placeholder="my_readonly_check"></label>
        <label><span data-i18n="webui.tool_field_desc">说明（模型据此决定何时调用）</span><textarea data-field="description" rows="3"></textarea></label>
        <label><span data-i18n="webui.tool_field_category">分类</span><input data-field="category" type="text" placeholder="自定义"></label>
        <label><span data-i18n="webui.tool_field_params">参数 JSON Schema</span><textarea data-field="parameters" rows="8"></textarea></label>
        <label class="tool-field-inline"><input data-field="enabled" type="checkbox" checked>
          <span data-i18n="webui.tool_field_enabled">启用（停用后不会出现在模型的可用清单里）</span></label>
      </div>
      <div class="tool-form-actions">
        <button type="button" class="btn btn-sm" data-close-editor><span data-i18n="webui.tool_cancel">取消</span></button>
        <button type="button" class="btn btn-sm btn-primary" data-save-tool><span data-i18n="webui.tool_save">保存</span></button>
      </div>
    </div>
  </div>
</div>
